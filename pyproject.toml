[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfc-mcp-scheduler"
version = "0.1.0"
description = "MCP Server for Schedule Management with file import/export support"
authors = [{name = "LFC", email = "lfc@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.scripts]
lfc-mcp-scheduler = "lfc_mcp_scheduler.server:main"