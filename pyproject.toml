[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfc-mcp-scheduler"
version = "0.1.0"
description = "MCP Server for Schedule Management with file import/export support"
authors = [{name = "LFC", email = "lfc@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pandas>=2.0.0",
    "typing-extensions>=4.0.0",
    "fastmcp>=3.2.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.27.0",
]

[project.scripts]
lfc-mcp-scheduler = "lfc_mcp_scheduler.server:main"